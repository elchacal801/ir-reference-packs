    rationale: "Isolation NSG (Listing 145) keeps the VM running while cutting off the threat actor."
  - id: h04
    split: heldout
    scenario: ransomware
    kinds: [procedure, requires_context]
    question: "Before restoring from backups after a ransomware attack, how do we choose a safe restore point?"
