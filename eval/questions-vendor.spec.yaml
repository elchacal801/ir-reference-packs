# Held-out questions for the vendor documentation packs added 2026-10-25 (ms-defender, ms-sentinel,
# ms-purview-exchange, ms-windows-auditing, aws-security-ir), written after the ranking configuration was frozen and
# before any run. Run once with the frozen configuration; never used for tuning. Resolve with:
#   uv run python eval/build_questions.py --spec eval/questions-vendor.spec.yaml
# Evidence was chosen by reading the cited elements (exact-phrase lookup with eval/find_evidence.py), not from search
# rankings. Rationales describe where the evidence is without quoting it.
verified_by: Claude (AI agent) — read each evidence element's text; maintainer review pending
verified_date: "2026-10-25"
packs: [dynamic-ir, ms-defender, ms-sentinel, ms-purview-exchange, ms-windows-auditing, aws-security-ir]
# The AWS pages are not cleared for redistribution: record only a hash of their evidence quotes.
quotes: withhold_unredistributable
