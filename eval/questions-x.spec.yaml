# Held-out questions for ranking v3 (split x-heldout), written 2026-10-25 after the Azure, Google Cloud, FIRST and
# SWGDE packs were added and BEFORE any ranking v3 experiment. Sealed: never used for tuning; run exactly once, with
# the frozen v3 configuration (and once with the frozen v2 configuration as the baseline).
# Resolve with:  uv run python eval/build_questions.py --spec eval/questions-x.spec.yaml
# Phrased as a responder or an agent would ask during an incident. Evidence was chosen by reading the cited elements
# (exact-phrase lookup over the canonical documents, not the search index). No evidence element is used by the
# tuning sets (questions.yaml, questions-ms.yaml, questions-vendor.yaml, questions-cisa.yaml, questions-x-tuning).
verified_by: Claude (AI agent) — read each evidence element's text; maintainer review pending
verified_date: "2026-10-25"
packs: [dynamic-ir, nist-sp800-61r3, cisa-ir-playbooks, cisa-stopransomware, ms-learn-ir, ms-defender, ms-sentinel,
        ms-purview-exchange, ms-windows-auditing, aws-security-ir, ms-azure-ir, gcp-security-ir, first-standards,
        swgde-forensics]
quotes: withhold_unredistributable
questions:
  - id: x01
    split: x-heldout
    scenario: cloud_forensics
    kinds: [procedure]
    question: "We need forensic copies of an Azure VM's disks that will hold up legally. What does the process look like?"
    evidence:
      - [{pack: ms-azure-ir, element_id: azarch-forensics.workflow.l01.i02}]
    rationale: "Computer forensics chain of custody in Azure: the Copy-VmDigitalEvidence runbook's steps (snapshots of OS and data disks, immutable storage, hashes in Key Vault)."
  - id: x02
    split: x-heldout
    scenario: cloud_investigation
    kinds: [paraphrase]
    question: "Which Azure log shows who created or changed resources, like a new VM or a Key Vault access policy change?"
    evidence:
      - [{pack: ms-azure-ir, element_id: azmon-activity-log.p01},
         {pack: ms-azure-ir, element_id: azsec-management-monitoring-overview.activity-logging-and-auditing.p01}]
    rationale: "The activity log records management (control plane) operations; the security overview says it shows who performed what, and when."
  - id: x03
    split: x-heldout
    scenario: credential_compromise
    kinds: [procedure]
    question: "A Google Cloud service account key was pushed to a public GitHub repo. What do we do right now?"
