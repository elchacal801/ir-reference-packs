    framework: attack
    framework_id: T1564.008
    framework_name: Email Hiding Rules
    provenance: analyst_mapping
    relation: describes_detection_or_investigation
    rationale: Describes rules that delete messages from specific senders or move them to obscure folders so victims do not notice.
    analyst: "Claude (AI agent) for the maintainer"
    review_status: unreviewed
  - id: m016
    element_id: ch13.s02.s07.s02.p01
    framework: attack
    framework_id: T1528
    framework_name: Steal Application Access Token
    provenance: analyst_mapping
    relation: describes_detection_or_investigation
    rationale: Describes OAuth consent phishing in which victims grant malicious applications persistent mailbox access.
    analyst: "Claude (AI agent) for the maintainer"
    review_status: unreviewed
  - id: m017
    element_id: ch12.s07.s04.s01.p01
    framework: attack
    framework_id: T1684.001
    framework_name: Impersonation
    provenance: analyst_mapping
    relation: describes_technique
    rationale: Describes compromised accounts sending fraudulent messages, such as wire transfer requests, to commit fraud.
    analyst: "Claude (AI agent) for the maintainer"
    review_status: unreviewed
  - id: m018
    element_id: ch13.s02.s07.s04.p01
    framework: attack
    framework_id: T1684.001
    framework_name: Impersonation
    provenance: analyst_mapping
    relation: describes_technique
    rationale: Describes an attacker in a supplier's mailbox inserting messages into an established payment thread.
    analyst: "Claude (AI agent) for the maintainer"
    review_status: unreviewed
  - id: m019
    element_id: ch13.s02.s07.s03.p05
    framework: attack
    framework_id: T1657
    framework_name: Financial Theft
    provenance: analyst_mapping
    relation: describes_detection_or_investigation
    rationale: Directs tracing fraudulent transactions, wire transfer requests, invoice payments and vendor payment changes.
    analyst: "Claude (AI agent) for the maintainer"
    review_status: unreviewed

