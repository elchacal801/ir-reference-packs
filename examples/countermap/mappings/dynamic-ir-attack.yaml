    framework: attack
    framework_id: T1114.003
    framework_name: Email Forwarding Rule
    provenance: analyst_mapping
    relation: describes_detection_or_investigation
    rationale: Directs examination of inbox rules that automatically forward copies of incoming email to external addresses.
    analyst: "Claude (AI agent) for the maintainer"
    review_status: unreviewed
  - id: m015
