# Reference-pack contract: Microsoft Learn: Azure incident response, forensics and recovery. Validated against schemas/pack.schema.json.
schema_version: "1.0.0"
pack_id: ms-azure-ir
pack_version: "0.1.0"
title: "Microsoft Learn: Azure incident response, forensics and recovery"
description: >-
  Microsoft Learn articles for responding to incidents in Azure: the Azure incident response and ransomware
  guidance, the Microsoft cloud security benchmark controls for logging, threat detection and incident response,
  the Well-Architected incident response strategies, the computer-forensics chain-of-custody and ransomware-resilient
  backup architectures, the activity and resource logs with their schemas and diagnostic settings, VNet and NSG flow
  logs and packet capture, Key Vault logging and recovery, DDoS response, Azure Firewall logs and threat
  intelligence, Azure Backup ransomware protection, Blob Storage soft delete, versioning and immutability, and VM
  disk snapshots, VHD export and Run Command. Captured as HTML; each article's source commit and update time are
  recorded so later changes can be detected. The article list is generated from the published tables of contents
  (recipe.yaml discovery rules; articles.yaml).
source:
  title: "Microsoft Learn: Azure documentation (incident response, forensics and recovery)"
  authors: []
  publisher: "Microsoft"
  url: "https://learn.microsoft.com/en-us/azure/security/fundamentals/incident-response-overview"
  landing_page: "https://learn.microsoft.com/en-us/azure/security/"
  edition: "Microsoft Learn snapshot 2026-11-10"
  edition_identifier: "2026-11-10"
  publication_date: null   # continuously updated web documentation; per-article update times are in sources.lock.json
  retrieval_date: "2026-11-10"
  inputs:                   # one locked input per article: articles.yaml and sources.lock.json list them
    - source_id: ms-azure-ir/snapshot/2026-11-10
      role: authoritative
  notes: >-
    Vendor documentation that changes frequently. Service names, portal paths, CLI and PowerShell commands, log
    schemas and retention defaults are specific to the capture date; check `irpacks check-updates ms-azure-ir`
    before relying on procedural details.
recipe: recipe.yaml
rights: rights.yaml
citation:
  scheme: section_anchor
  locator: "published article URL with the section's heading anchor, the article's last update time and source commit"
  format: "Microsoft, “{article}”, “{section}”, Microsoft Learn (updated {updated_at}; source commit {commit}), {url}#{anchor}"
  notes: "Web articles are not paginated; never cite page numbers for this pack."
applicability:
