# Build recipe for the aws-security-ir pack: published AWS documentation pages, captured as HTML snapshots.
# Each page is its own source identity (one capture date). AWS pages carry no source commit or update time, so
# change detection compares the article title and a hash of the article body text (irpacks check-updates).
#
# The article list is generated: `irpacks sources discover aws-security-ir` applies the discovery rules below to
# the guides' published tables of contents (toc-contents.json) and writes articles.yaml. Review its diff, then lock.
# Selection: incident response guidance and the detection and log references responders use; account setup,
# billing, IAM-for-the-service and tutorial sections are left out.
route: aws_docs_html
inputs:
  snapshot: "2026-10-25"
artifacts_file: articles.yaml
discovery:
  base: https://docs.aws.amazon.com/
  rules:
    # AWS Security Incident Response: the IR lifecycle guidance (the former "AWS Security Incident Response Guide"
    # whitepaper now redirects here) and the service's case workflow.
    - toc: security-ir/latest/userguide
      prefix: sir
      docset: security-ir
      include: ['.*']
      exclude: ['^Security( >|$)', 'Document history', '^Tagging', '^Using AWS CloudShell', '^Amazon EventBridge',
                '^Troubleshooting', 'Cancel Membership', 'Quotas', '^Managing accounts with AWS Organizations']
    # AWS Well-Architected security pillar: detection and incident response best practices (SEC10).
    - toc: wellarchitected/latest/security-pillar
      prefix: wasec
      docset: well-architected
      include: ['^(Incident response|Detection)( >|$)']
    # Amazon GuardDuty: finding types, finding format and details, remediation procedures.
    - toc: guardduty/latest/ug
      prefix: gd
      docset: guardduty
      include: ['^(Finding types|Understanding and generating findings|Remediating findings|Extended Threat Detection|Investigation - Preview)( >|$)',
                'Findings that invoke', '^Managing GuardDuty findings( > (Filtering GuardDuty findings|Suppression rules|Processing findings|Exporting generated findings))?$']
    # Amazon Detective: investigating findings and entities in the behavior graph.
    - toc: detective/latest/userguide
      prefix: det
      docset: detective
      include: ['^(Concepts and terminology|Data in a behavior graph|Summary dashboard|How Detective is used for investigation|Analyzing findings|Analyzing entities|Searching for a finding or entity)( >|$)']
    # AWS CloudTrail: event and record reference, log files, event history, Insights and Lake queries.
    - toc: awscloudtrail/latest/userguide
      prefix: ct
      docset: cloudtrail
      include: ['^(Understanding CloudTrail events|CloudTrail log files|Working with CloudTrail event history)( >|$)',
                '^Working with CloudTrail Insights( >|$)', '^Working with CloudTrail Lake > Queries( >|$)']
    # Amazon VPC Flow Logs: record format and examples.
    - toc: vpc/latest/userguide
      prefix: vpc
      docset: vpc
      include: ['[Ff]low log']
chunking:
  min_tokens: 600
  max_tokens: 1000
  overlap_tokens: 100
  overlap_min_tokens: 80
  overlap_max_tokens: 120
corpus:
  default: narrative
  rules: []
