# Reference-pack contract: Microsoft Learn: Windows security auditing and security event reference. Validated against schemas/pack.schema.json.
schema_version: "1.0.0"
pack_id: ms-windows-auditing
pack_version: "0.1.0"
title: "Microsoft Learn: Windows security auditing and security event reference"
description: >-
  The Windows security auditing reference on Microsoft Learn: basic and advanced security audit policies and the
  per-event reference for Windows security log events (for example 4624, 4688, 4720), with event fields, meanings
  and security monitoring recommendations. Published under previous versions (Windows 10) and still the reference
  for these event IDs. Captured as HTML on 2026-10-25; each article's source commit and update time are recorded so
  later changes can be detected. The article list is generated from the published tables of contents (recipe.yaml
  discovery rules; articles.yaml).
