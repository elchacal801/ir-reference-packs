description: >-
  The joint #StopRansomware Guide, version 3.0 (October 2023), developed through the Joint Ransomware Task Force:
  ransomware and data-extortion prevention best practices grouped by initial access vector, general hardening
  guidance, and the ransomware response checklist (detection and analysis, reporting and notification, containment
  and eradication, recovery and post-incident activity), with response contacts and resources. Converted from the
  tagged PDF's structure tree, with the PDF outline as hierarchy.
