# Reference-pack contract: SWGDE digital-evidence best practices for acquisition, preservation, examination and reporting. Validated against schemas/pack.schema.json.
schema_version: "1.0.0"
pack_id: swgde-forensics
pack_version: "0.1.0"
title: "SWGDE best practices: digital evidence acquisition, preservation, examination and reporting"
description: >-
  Fifteen current documents of the Scientific Working Group on Digital Evidence (SWGDE): remote collection of
  digital evidence from an endpoint, evidence acquisition from cloud service providers, computer forensic
  acquisitions, Apple macOS acquisition, Linux technical notes, acquiring online content, minimization of evidence
  seizure, computer forensic examination, mobile device forensic analysis, archiving, report writing, collection
  myths vs facts, the model SOP for computer forensics, data integrity, and the digital and multimedia evidence
  glossary. Converted from each PDF's page layout and outline (the files are untagged or carry unusable tags).
source:
  title: "SWGDE published documents (digital evidence acquisition, preservation, examination and reporting)"
  authors: []
  publisher: "Scientific Working Group on Digital Evidence (SWGDE)"
  url: "https://www.swgde.org/documents/published-complete-listing/"
  landing_page: "https://www.swgde.org/documents/published-complete-listing/"
  edition: "SWGDE documents current on 2026-10-25"
  edition_identifier: "2026-10-25"
  publication_date: null   # each document has its own number, version and date (source-map.json)
  retrieval_date: "2026-10-25"
  inputs:
    - source_id: swgde-forensics/snapshot/2026-10-25
      role: authoritative
  notes: >-
    Every document is a published (non-draft) SWGDE document listed as current on 2026-10-25. Several date from
    2006-2018; SWGDE advises readers to verify on swgde.org that they use the current version.
recipe: recipe.yaml
rights: rights.yaml
