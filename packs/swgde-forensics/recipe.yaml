# Build recipe for the swgde-forensics pack: SWGDE best-practice documents (PDF), one unit per document, converted
# from the page layout (route pdf_collection_layout; src/irpacks/route_layout.py). The PDFs are untagged (re-distilled
# through Ghostscript) or Word-tagged without a usable hierarchy, so structure comes from the layout and the PDF outline.
# Each document is its own source identity; `irpacks check-updates swgde-forensics` compares HTTP validators.
# Selection: the current SWGDE documents an incident responder uses for evidence acquisition, preservation,
# examination and reporting (Forensics and Quality & Standards committees); audio, image, video, vehicle, IoT,
# skimmer and other device-specific documents are left out.
route: pdf_collection_layout
inputs:
  snapshot: "2026-10-25"
# Every document is taken from SWGDE's published complete listing, not the drafts for public comment. Citations
# state it, as the SWGDE redistribution policy asks of any reference or quotation (version and draft status).
document_status: published
printed_labels:
  pattern: 'Page (\d+) of \d+'
