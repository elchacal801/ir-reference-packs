pdf_only_regions:
  - kind: toc
    bookmark: "Table of Contents"
    insert_after: fm-front-matter
  - kind: index
    bookmark: "Index"
    attach_to: bm-index

chunking:
  min_tokens: 600
  max_tokens: 1000
  overlap_tokens: 100
  overlap_min_tokens: 80
  overlap_max_tokens: 120

corpus:
  default: narrative
  rules:
    - {within: fm-front-matter, corpus: front_matter, include: false, reason: "title, copyright and license page (non-substantive front matter)"}
    - {within: fm-table-of-contents, corpus: navigation, include: false, reason: "printed table of contents (navigation)"}
    - {within: fm-praise-for-dynamic-incident-response, corpus: front_matter, include: false, reason: "endorsement quotations (non-substantive front matter)"}
    - {within: bm-index, corpus: index, include: false, reason: "back-of-book index (navigation)"}
    - {within: bm-colophon, corpus: back_matter, include: false, reason: "colophon: production notes (non-substantive back matter)"}

pilot:
  description: >-
    All of Chapter 6 plus selected technical sections of Chapters 12, 13 and 16: diagrams (Ch. 6), tables and
    footnotes (12.3), code/figures/admonitions/sidebar incl. DNS Sinkholes (12.4), cross-page procedures
    (12 and 13 Step-by-Step), code and footnotes (13.4), embedded prompts and code (16.2-16.3).
  keep:
    - ch06
    - ch12.s03
    - ch12.s04
    - ch12.s10
    - ch13.s04
    - ch13.s06
    - ch16.s02
    - ch16.s03
  extra_pages_bookmarks: []   # chapter-end footnote pages are added automatically for kept chapters
