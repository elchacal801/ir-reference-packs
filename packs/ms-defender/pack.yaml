# Reference-pack contract: Microsoft Learn: Microsoft Defender investigation, response and advanced hunting. Validated against schemas/pack.schema.json.
schema_version: "1.0.0"
pack_id: ms-defender
pack_version: "0.1.0"
title: "Microsoft Learn: Microsoft Defender investigation, response and advanced hunting"
description: >-
  Microsoft Learn articles on investigating and responding with Microsoft Defender: Defender XDR incidents, alerts,
  automated investigation and response, advanced hunting (including the schema reference) and threat intelligence;
  Defender for Endpoint investigation and response actions; Defender for Identity security alerts and investigation;
  Defender for Office 365 investigation, remediation and step-by-step guides; Defender for Cloud Apps threat
  detection and investigation; and Defender for Cloud security alerts and response. Captured as HTML on 2026-10-25;
  each article's source commit and update time are recorded so later changes can be detected. The article list is
  generated from the published tables of contents (recipe.yaml discovery rules; articles.yaml).
source:
  title: "Microsoft Learn: Microsoft Defender XDR, Endpoint, Identity, Office 365, Cloud Apps and Cloud documentation (investigation and response)"
  authors: []
  publisher: "Microsoft"
  url: "https://learn.microsoft.com/en-us/defender-xdr/investigate-incidents"
  landing_page: "https://learn.microsoft.com/en-us/defender-xdr/"
  edition: "Microsoft Learn snapshot 2026-10-25"
  edition_identifier: "2026-10-25"
  publication_date: null   # continuously updated web documentation; per-article update times are in sources.lock.json
  retrieval_date: "2026-10-25"
  inputs:                   # one locked input per article: articles.yaml and sources.lock.json list them
    - source_id: ms-defender/snapshot/2026-10-25
      role: authoritative
  notes: >-
    Vendor documentation that changes frequently. Product names, portal paths, cmdlets and table schemas are
    specific to the capture date; check `irpacks check-updates ms-defender` before relying on procedural details.
