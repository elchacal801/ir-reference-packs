description: >-
  CISA's operational procedures for planning and conducting cybersecurity incident and vulnerability response in
  Federal Civilian Executive Branch information systems (Executive Order 14028, section 6): the incident response
  playbook (preparation, detection and analysis, containment, eradication and recovery, post-incident activities,
  coordination), the vulnerability response playbook, key terms, and the incident response and preparation
  checklists. Converted from the tagged PDF's structure tree, with the PDF outline as hierarchy.
